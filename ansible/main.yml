---
- name: Ubuntu 极客开发机自动化装机剧本 (Provisioning Playbook)
  hosts: localhost
  connection: local
  become: yes
  vars:
    target_user: "dailyuser"
    proxy_env:
      http_proxy: "http://127.0.0.1:{{ mihomo_port | default('7890') }}"
      https_proxy: "http://127.0.0.1:{{ mihomo_port | default('7890') }}"
      DEBIAN_FRONTEND: noninteractive
      NEEDRESTART_MODE: a
      NEEDRESTART_FRONTEND: noninteractive

  pre_tasks:
    - name: 拦截 APT 自动启动服务 (防止无头虚拟机内核与 systemd 死锁)
      ansible.builtin.copy:
        dest: /usr/sbin/policy-rc.d
        content: |
          #!/bin/sh
          exit 101
        mode: '0755'
    
    - name: 预创建 Homebrew 目录以修复权限 (由 Root 执行)
      ansible.builtin.file:
        path: /home/linuxbrew/.linuxbrew
        state: directory
        owner: "{{ target_user }}"
        group: "{{ target_user }}"
        mode: '0755'

  roles:
    - { role: network, tags: ['network'] }
    - { role: system, tags: ['system'] }
    - { role: packages, environment: "{{ proxy_env }}", tags: ['packages', 'pkg'] }
    - { role: desktop, environment: "{{ proxy_env }}", become_user: "{{ target_user }}", tags: ['desktop'] }
    - { role: dev_tools, environment: "{{ proxy_env }}", become_user: "{{ target_user }}", tags: ['dev_tools', 'dev'] }
    - { role: user, become_user: "{{ target_user }}", tags: ['user', 'dotfiles'] }
  post_tasks:
    - name: 解除 APT 服务自动启动拦截
      ansible.builtin.file:
        path: /usr/sbin/policy-rc.d
        state: absent
