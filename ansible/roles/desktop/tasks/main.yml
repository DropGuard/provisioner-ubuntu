---
# 桌面环境与输入法配置 (KDE & Fcitx5)

- name: 创建 Fcitx5 雾凇拼音词库目录
  ansible.builtin.file:
    path: "~/.local/share/fcitx5/rime"
    state: directory
    mode: '0755'

- name: 克隆 Rime-Ice 极品词库 (深度为1，提速)
  ansible.builtin.git:
    repo: 'https://github.com/iDvel/rime-ice.git'
    dest: "~/.local/share/fcitx5/rime"
    depth: 1
  # github 拉取是易碎步骤;失败只记录,不能连带跳过本文件的 fcitx5 默认配置。

- name: 创建 Fcitx5 环境变量目录
  ansible.builtin.file:
    path: "~/.config/environment.d"
    state: directory
    mode: '0755'

- name: 写入 Fcitx5 环境变量 (Environment.d)
  ansible.builtin.copy:
    dest: "~/.config/environment.d/fcitx5.conf"
    content: |
      XMODIFIERS=@im=fcitx5
      SDL_IM_MODULE=fcitx5
      GLFW_IM_MODULE=ibus
    mode: '0644'
- name: 创建 Fcitx5 配置目录
  ansible.builtin.file:
    path: "~/.config/fcitx5"
    state: directory
    mode: '0755'

- name: 直接写入 Fcitx5 Profile (将 Rime 设为默认)
  ansible.builtin.copy:
    dest: "~/.config/fcitx5/profile"
    content: |
      [Groups/0]
      Name=Default
      Default Layout=keyboard-us
      DefaultIM=rime

      [Groups/0/Items/0]
      Name=keyboard-us
      Layout=

      [Groups/0/Items/1]
      Name=rime
      Layout=

      [GroupOrder]
      0=Default
    mode: '0644'

- name: 设置默认看图和视频软件 (qimgv)
  ansible.builtin.shell: |
    xdg-mime default qimgv.desktop image/jpeg image/png image/gif image/webp image/bmp image/tiff

- name: 创建 Konsole 自定义配置目录
  ansible.builtin.file:
    path: "~/.local/share/konsole"
    state: directory
    mode: '0755'

- name: 注入带有 Nerd Font 的 Konsole Profile
  ansible.builtin.copy:
    dest: "~/.local/share/konsole/Dropguard.profile"
    content: |
      [Appearance]
      ColorScheme=Breeze
      Font=JetBrainsMono NF,14,-1,5,50,0,0,0,0,0

      [General]
      Name=Dropguard
      Parent=FALLBACK/
    mode: '0644'

- name: 设为 KDE 全局默认终端配置
  ansible.builtin.copy:
    dest: "~/.config/konsolerc"
    content: |
      [Desktop Entry]
      DefaultProfile=Dropguard.profile

      [General]
      ConfigVersion=1
    mode: '0644'

- name: 配置 Firefox 环境变量以支持 NVIDIA 硬解 (Flatpak Override)
  ansible.builtin.command: flatpak override --user --env={{ item }} org.mozilla.firefox
  loop:
    - MOZ_DISABLE_RDD_SANDBOX=1
    - LIBVA_DRIVER_NAME=nvidia
  # 此步骤可能在没有 X11/Wayland 运行环境的纯非交互时警告，但依然能写入 config
  ignore_errors: yes

- name: 确保 Firefox Flatpak 配置目录存在
  ansible.builtin.file:
    path: "~/.var/app/org.mozilla.firefox/config/mozilla/firefox/default"
    state: directory
    mode: '0755'

- name: 物理预埋 Firefox profiles.ini (不能使用软链接以避开沙盒限制)
  ansible.builtin.copy:
    dest: "~/.var/app/org.mozilla.firefox/config/mozilla/firefox/profiles.ini"
    content: |
      [Profile0]
      Name=default
      IsRelative=1
      Path=default
      Default=1

      [General]
      StartWithLastProfile=1
      Version=2
    mode: '0644'

- name: 物理预埋 Firefox user.js 以开启硬解
  ansible.builtin.copy:
    dest: "~/.var/app/org.mozilla.firefox/config/mozilla/firefox/default/user.js"
    content: |
      user_pref("media.ffmpeg.vaapi.enabled", true);
      user_pref("gfx.webrender.all", true);
    mode: '0644'

- name: 设置 PeaZip 为默认解压软件
  ansible.builtin.shell: |
    xdg-mime default io.github.peazip.PeaZip.desktop application/zip application/x-7z-compressed application/x-rar application/x-tar application/gzip application/x-bzip2 application/x-xz
