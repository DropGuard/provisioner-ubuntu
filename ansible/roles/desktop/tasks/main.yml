---
# 桌面环境与输入法配置 (KDE & Fcitx5)

- name: 创建 Fcitx5 雾凇拼音词库目录
  ansible.builtin.file:
    path: "~/.local/share/fcitx5/rime"
    state: directory
    mode: '0755'

- name: 克隆 Rime-Ice 极品词库 (深度为1，提速)
  ansible.builtin.git:
    repo: 'https://github.com/iDvel/rime-ice.git'
    dest: "~/.local/share/fcitx5/rime"
    depth: 1
  # github 拉取是易碎步骤;失败只记录,不能连带跳过本文件的 fcitx5 默认配置。

- name: 创建 Fcitx5 环境变量目录
  ansible.builtin.file:
    path: "~/.config/environment.d"
    state: directory
    mode: '0755'

- name: 写入 Fcitx5 环境变量 (Environment.d)
  ansible.builtin.copy:
    dest: "~/.config/environment.d/fcitx5.conf"
    content: |
      XMODIFIERS=@im=fcitx5
      SDL_IM_MODULE=fcitx5
      GLFW_IM_MODULE=ibus
    mode: '0644'
- name: 创建 Fcitx5 配置目录
  ansible.builtin.file:
    path: "~/.config/fcitx5"
    state: directory
    mode: '0755'

- name: 直接写入 Fcitx5 Profile (将 Rime 设为默认)
  ansible.builtin.copy:
    dest: "~/.config/fcitx5/profile"
    content: |
      [Groups/0]
      Name=Default
      Default Layout=keyboard-us
      DefaultIM=rime

      [Groups/0/Items/0]
      Name=keyboard-us
      Layout=

      [Groups/0/Items/1]
      Name=rime
      Layout=

      [GroupOrder]
      0=Default
    mode: '0644'

- name: 设置默认看图和视频软件 (qimgv)
  ansible.builtin.shell: |
    if [ "$(xdg-mime query default image/jpeg)" != "qimgv.desktop" ]; then
      xdg-mime default qimgv.desktop image/jpeg image/png image/gif image/webp image/bmp image/tiff
      echo "changed"
    fi
  register: mime_qimgv
  changed_when: "'changed' in mime_qimgv.stdout"

- name: 配置 Firefox 环境变量以支持 NVIDIA 硬解 (Flatpak Override)
  ansible.builtin.command: flatpak override --user --env={{ item }} org.mozilla.firefox
  loop:
    - MOZ_DISABLE_RDD_SANDBOX=1
    - LIBVA_DRIVER_NAME=nvidia
  # 此步骤可能在没有 X11/Wayland 运行环境的纯非交互时警告，但依然能写入 config
  ignore_errors: yes

- name: 确保 Firefox Flatpak 配置目录存在
  ansible.builtin.file:
    path: "~/.var/app/org.mozilla.firefox/config/mozilla/firefox/default"
    state: directory
    mode: '0755'

- name: 物理预埋 Firefox profiles.ini (声明式局部配置，不破坏原生生成)
  community.general.ini_file:
    path: "~/.var/app/org.mozilla.firefox/config/mozilla/firefox/profiles.ini"
    section: "{{ item.section }}"
    option: "{{ item.option }}"
    value: "{{ item.value }}"
    mode: '0644'
    create: yes
  loop:
    - { section: 'Profile0', option: 'Name', value: 'default' }
    - { section: 'Profile0', option: 'IsRelative', value: '1' }
    - { section: 'Profile0', option: 'Path', value: 'default' }
    - { section: 'Profile0', option: 'Default', value: '1' }
    - { section: 'General', option: 'StartWithLastProfile', value: '1' }
    - { section: 'General', option: 'Version', value: '2' }

- name: 物理预埋 Firefox user.js 以开启硬解
  ansible.builtin.copy:
    dest: "~/.var/app/org.mozilla.firefox/config/mozilla/firefox/default/user.js"
    content: |
      user_pref("media.ffmpeg.vaapi.enabled", true);
      user_pref("gfx.webrender.all", true);
    mode: '0644'

- name: 设置 PeaZip 为默认解压软件
  ansible.builtin.shell: |
    if [ "$(xdg-mime query default application/zip)" != "io.github.peazip.PeaZip.desktop" ]; then
      xdg-mime default io.github.peazip.PeaZip.desktop application/zip application/x-7z-compressed application/x-rar application/x-tar application/gzip application/x-bzip2 application/x-xz
      echo "changed"
    fi
  register: mime_peazip
  changed_when: "'changed' in mime_peazip.stdout"


- name: 设置 Kitty 为 KDE Plasma 全局默认终端
  ansible.builtin.command: kwriteconfig6 --file kdeglobals --group General --key TerminalApplication --type string "kitty"

- name: 创建 Haruna 配置目录
  ansible.builtin.file:
    path: "~/.config/haruna"
    state: directory
    mode: '0755'

- name: 实体复制 Haruna 基准配置 (物理隔离，彻底杜绝播放历史写入 Git 仓库)
  ansible.builtin.copy:
    src: "{{ playbook_dir | dirname }}/config/haruna/"
    dest: "~/.config/haruna/"
    mode: '0644'
