---
# 软件包管理 (APT, Snap, Flatpak)

- name: 安装核心开发与实用工具
  ansible.builtin.apt:
    name:
      - build-essential
      - curl
      - git
      - docker.io
      - ripgrep
      - eza
      - unzip
      - zip
      - jq
      - htop
      - kitty
      - mpv
      - qimgv
    state: present
    update_cache: yes

- name: 安装全局 Flatpak 软件
  community.general.flatpak:
    name: "{{ item }}"
    state: present
    method: system
  loop:
    # 这里可以直接读取原先配置里的列表，作为演示先写死几个
    - org.mozilla.firefox
  ignore_errors: yes # 对应 Go 代码里的最佳努力 (best-effort)

- name: 安装局域网定制工具 (CC-Switch 等，如果安装包存在)
  ansible.builtin.apt:
    deb: "{{ item }}"
  loop:
    - "/usr/local/share/provisioner-ubuntu/config/cc-switch.deb"
  ignore_errors: yes
