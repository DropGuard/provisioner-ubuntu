---
# 网络与系统源配置

- name: 替换 Ubuntu 默认源为阿里云 (提速)
  ansible.builtin.replace:
    path: /etc/apt/sources.list.d/ubuntu.sources
    regexp: 'cn\.archive\.ubuntu\.com|archive\.ubuntu\.com|security\.ubuntu\.com'
    replace: 'mirrors.aliyun.com'
  become: yes


- name: 添加 Enpass 官方 APT 仓库
  ansible.builtin.shell: |
    echo "deb https://apt.enpass.io/ stable main" > /etc/apt/sources.list.d/enpass.list
    curl -fsSL https://apt.enpass.io/keys/enpass-linux.key > /etc/apt/trusted.gpg.d/enpass.asc
  args:
    creates: /etc/apt/sources.list.d/enpass.list
  become: yes

- name: 部署并启动 Clash Verge 代理核心
  ansible.builtin.shell: |
    set -e
    debURL="https://dl.p6p.net/clash-verge/v2.5.1/Clash.Verge_2.5.1_amd64.deb"
    curl -fsSL -o /tmp/clash-verge.deb "$debURL"
    dpkg -i /tmp/clash-verge.deb 2>/dev/null || apt-get -f install -y
    rm -f /tmp/clash-verge.deb
    mkdir -p /usr/local/lib/mihomo
    # 此处假设 config 目录已被同步到了 /opt/provision/config
    # 读取订阅链接并下载配置
    curl -fsSL -A "clash-verge/v2.5.1" "$(cat /usr/local/share/provisioner-ubuntu/config/proxy-subscription.txt)" -o "/usr/local/lib/mihomo/config.yaml"
    nohup /usr/bin/verge-mihomo -f "/usr/local/lib/mihomo/config.yaml" -d "/usr/lib/Clash Verge/resources" > "/usr/local/lib/mihomo/mihomo.log" 2>&1 &
  args:
    creates: /usr/local/lib/mihomo/config.yaml
  become: yes
  ignore_errors: yes


- name: 等待 Mihomo 代理端口 (7897) 绑定就绪 (Ansible Native)
  ansible.builtin.wait_for:
    host: 127.0.0.1
    port: 7897
    state: started
    timeout: 30
  become: yes
- name: 设置 sudo 的代理环境变量保持 (sudoers env_keep)
  ansible.builtin.copy:
    dest: /etc/sudoers.d/proxy
    content: 'Defaults env_keep += "http_proxy https_proxy all_proxy"'
    mode: '0440'
  become: yes
- name: 更新 APT 缓存
  ansible.builtin.apt:
    update_cache: yes
  become: yes
