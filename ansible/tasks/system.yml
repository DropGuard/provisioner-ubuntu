---
# 基础系统与安全配置

- name: 确保系统安装了 UFW 防火墙
  ansible.builtin.apt:
    name: ufw
    state: present

- name: 配置默认的 UFW 防火墙规则 (默认拒绝外网访问)
  community.general.ufw:
    state: enabled
    default: deny
    direction: incoming

- name: 允许外网通过 SSH 访问，但开启防爆破限流
  community.general.ufw:
    rule: limit
    port: '22'
    proto: tcp

- name: 确保日常用户加入 Docker 组 (免 sudo 执行)
  ansible.builtin.user:
    name: "{{ target_user }}"
    groups: docker
    append: yes

- name: 安装 NVIDIA GPU 专有驱动 (自动检测)
  ansible.builtin.shell: |
    if lspci | grep -i nvidia > /dev/null; then
      ubuntu-drivers autoinstall
    fi
  become: yes
  changed_when: false


- name: 配置 NVIDIA Wayland 最佳实践 (内核参数与显存保护)
  ansible.builtin.shell: |
    if lspci | grep -i nvidia > /dev/null; then
      # 1. 注入内核参数 (启用 modeset 和 fbdev)
      if ! grep -q "nvidia_drm.modeset=1" /etc/default/grub; then
        sed -i 's/GRUB_CMDLINE_LINUX_DEFAULT="\(.*\)"/GRUB_CMDLINE_LINUX_DEFAULT="\1 nvidia_drm.modeset=1 nvidia_drm.fbdev=1"/' /etc/default/grub
        update-grub
      fi
      # 2. 注入模块配置 (显存唤醒保护)
      echo "options nvidia NVreg_PreserveVideoMemoryAllocations=1" > /etc/modprobe.d/nvidia-power-management.conf
      systemctl enable nvidia-suspend nvidia-hibernate nvidia-resume
      update-initramfs -u
    fi
  become: yes
  changed_when: false
