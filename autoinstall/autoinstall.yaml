#cloud-config
# Ubuntu autoinstall configuration — fully automated single-system setup.
#
# Disk selection uses match.serial (the safest method). Replace the
# placeholder below with the serial from `lsblk -o NAME,SERIAL,MODEL,SIZE`.
# If no disk matches, the installer halts — it will never write to the
# wrong disk.
#
# To find your disk serial:
#   lsblk -o NAME,SERIAL,MODEL,SIZE

autoinstall:
  version: 1

  # --- Identity ---
  identity:
    hostname: ubuntu
    username: dailyuser
    # __USER_PASSWORD_HASH__ is replaced by copy-to-usb.ps1 / prepare-usb.sh
    # at USB-build time using `openssl passwd -6`.
    password: __USER_PASSWORD_HASH__

  # --- Locale ---
  locale: en_US.UTF-8
  timezone: Asia/Shanghai
  keyboard:
    layout: us

  # --- Storage: whole-disk, GPT, ext4, no LUKS ---
  # Use the `layout` feature (not a hand-written `config:` block — the two are
  # mutually exclusive: when `layout` is set, `config:` is ignored).
  # Match by disk serial so the installer never writes to the wrong disk.
  # Keep the serial in sync with prepare-usb.sh / copy-to-usb.py.
  storage:
    layout:
      name: direct
      # Match by disk serial — the physical, unique ID of the system SSD.
      # __DISK_SERIAL__ is replaced by prepare-usb.sh / copy-to-usb.py at
      # USB-build time. If no serial matches, the installer aborts rather
      # than touching a wrong disk.
      match:
        serial: __DISK_SERIAL__
    grub:
      # Keep the freshly-installed disk as the first boot entry. Without this
      # the firmware may fall back to the USB and re-run autoinstall in a loop.
      reorder_uefi: False
    swap:
      size: 0

  # --- Packages: essentials only (provision.sh handles the rest) ---
  packages:
    - openssh-server
    - curl
    - git
    - build-essential

  # --- Snaps: installed natively by the installer (code needs --classic) ---
  snaps:
    - name: firefox
    - name: obsidian
    - name: code
      classic: true

  # --- SSH: allow remote access after install ---
  ssh:
    install-server: true
    allow-pw: true

  # --- Late commands ---
  # These run inside the installed system (chrooted to /target).
  late-commands:
    # Ubuntu 26.04 desktop installer BUG: the Locale/TimeZone controllers are
    # no-ops for the target (verified in KVM: debug log has zero tzdata handling,
    # /etc/locale.conf stays LANG=C.UTF-8, /etc/localtime stays Etc/UTC despite
    # `locale:`/`timezone:` being accepted). Apply them explicitly.
    - echo 'LANG=en_US.UTF-8' > /target/etc/locale.conf
    - sed -i 's/^# en_US.UTF-8/en_US.UTF-8/' /target/etc/locale.gen
    - curtin in-target --target=/target -- locale-gen
    - ln -sf /usr/share/zoneinfo/Asia/Shanghai /target/etc/localtime
    - curtin in-target --target=/target -- bash -c 'printf "tzdata tzdata/Areas select Asia\ntzdata tzdata/Zones/Asia select Shanghai\n" | debconf-set-selections'

    # Enable GDM automatic login so the user lands on the desktop without
    # entering a password. sudo will still require the password.
    - |
      cat > /target/etc/gdm3/custom.conf << 'EOF'
      [daemon]
      AutomaticLoginEnable=true
      AutomaticLogin=dailyuser
      EOF

    # Copy provision.sh, config files, dotfiles, and helper scripts into the installed system.
    # cloud-init mounts the seed ISO at /cdrom — our files live there under
    # the nocloud/ subdirectory.
    - mkdir -p /target/usr/local/share/provisioner-ubuntu/config /target/usr/local/share/provisioner-ubuntu/dotfiles
    - cp /cdrom/nocloud/provision.sh /target/usr/local/bin/provision
    - cp /cdrom/nocloud/test-env-loading.sh /target/usr/local/bin/test-env-loading
    - cp /cdrom/nocloud/fav.sh /target/usr/local/bin/fav 2>/dev/null || true
    - cp /cdrom/nocloud/setup-fcitx5-chinese.sh /target/usr/local/bin/setup-fcitx5-chinese.sh
    - cp -a /cdrom/nocloud/config/. /target/usr/local/share/provisioner-ubuntu/config/ 2>/dev/null || true
    - cp -a /cdrom/nocloud/dotfiles/. /target/usr/local/share/provisioner-ubuntu/dotfiles/ 2>/dev/null || true
    - chmod +x /target/usr/local/bin/provision /target/usr/local/bin/test-env-loading /target/usr/local/bin/fav /target/usr/local/bin/setup-fcitx5-chinese.sh 2>/dev/null || true

    # Register a systemd oneshot service that runs provision.sh on first boot.
    - cp /cdrom/nocloud/first-boot.service /target/etc/systemd/system/first-boot.service
    - curtin in-target --target=/target -- systemctl enable first-boot.service

  # --- Final action: reboot into the installed system ---
  shutdown: reboot
